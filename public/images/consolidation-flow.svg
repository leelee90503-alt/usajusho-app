<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <linearGradient id="smallBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF1F3"/>
      <stop offset="1" stop-color="#E1E6E9"/>
    </linearGradient>
    <linearGradient id="bigBoxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#22A99C"/>
    </linearGradient>
    <linearGradient id="bigBoxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2A3C"/>
      <stop offset="1" stop-color="#0B2230"/>
    </linearGradient>
    <linearGradient id="bigBoxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173A50"/>
      <stop offset="1" stop-color="#0F2A3C"/>
    </linearGradient>
  </defs>

  <!-- three small source packages, stacked/offset like a small pile -->
  <g>
    <rect x="14" y="46" width="40" height="40" rx="6" fill="url(#smallBox)" stroke="#C9D0D4" stroke-width="1.5"/>
    <rect x="14" y="46" width="40" height="10" rx="6" fill="#D8DEE1"/>
    <line x1="34" y1="46" x2="34" y2="86" stroke="#C9D0D4" stroke-width="1"/>

    <rect x="4" y="60" width="40" height="40" rx="6" fill="url(#smallBox)" stroke="#C9D0D4" stroke-width="1.5"/>
    <rect x="4" y="60" width="40" height="10" rx="6" fill="#D8DEE1"/>
    <line x1="24" y1="60" x2="24" y2="100" stroke="#C9D0D4" stroke-width="1"/>

    <rect x="24" y="70" width="40" height="40" rx="6" fill="url(#smallBox)" stroke="#C9D0D4" stroke-width="1.5"/>
    <rect x="24" y="70" width="40" height="10" rx="6" fill="#D8DEE1"/>
    <line x1="44" y1="70" x2="44" y2="110" stroke="#C9D0D4" stroke-width="1"/>
  </g>

  <!-- arrow -->
  <g stroke="#8A97A0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="98" y1="80" x2="168" y2="80"/>
    <path d="M156 68 L168 80 L156 92"/>
  </g>

  <!-- one consolidated box, isometric, larger + accent-colored to show "the result" -->
  <g transform="translate(190,10)">
    <ellipse cx="80" cy="103" rx="70" ry="9" fill="#0F2A3C" opacity="0.08"/>

    <polygon points="20,40 80,10 140,40 80,70" fill="url(#bigBoxTop)"/>
    <polygon points="20,40 80,70 80,100 20,70" fill="url(#bigBoxFront)"/>
    <polygon points="80,70 140,40 140,70 80,100" fill="url(#bigBoxSide)"/>

    <!-- tape -->
    <line x1="50" y1="25" x2="50" y2="85" stroke="#0B2230" stroke-width="2" opacity="0.35"/>
    <polygon points="20,40 80,10 140,40 80,70" fill="none" stroke="#0B2230" stroke-width="1" opacity="0.25"/>

    <!-- consolidated ref label -->
    <g transform="translate(96,52)">
      <rect x="0" y="0" width="38" height="26" rx="3" fill="#FFFFFF"/>
      <rect x="5" y="5" width="28" height="3.5" rx="1.5" fill="#0F2A3C"/>
      <rect x="5" y="11" width="20" height="3" rx="1.5" fill="#8A97A0"/>
      <rect x="5" y="17" width="24" height="3" rx="1.5" fill="#8A97A0"/>
    </g>

    <!-- small "1" badge -->
    <g transform="translate(80,4)">
      <circle cx="0" cy="0" r="11" fill="#0F2A3C"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2EC4B6" font-weight="700">1</text>
    </g>
  </g>
</svg>
