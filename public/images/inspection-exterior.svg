<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F7"/>
      <stop offset="1" stop-color="#E8ECEE"/>
    </linearGradient>
    <linearGradient id="boxTop1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A876"/>
      <stop offset="1" stop-color="#B8946060"/>
    </linearGradient>
    <linearGradient id="boxFront1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B98B"/>
      <stop offset="1" stop-color="#C7A574"/>
    </linearGradient>
    <linearGradient id="boxSide1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AD8C5C"/>
      <stop offset="1" stop-color="#9A7B4E"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad1)"/>

  <!-- subtle floor shadow -->
  <ellipse cx="200" cy="322" rx="120" ry="14" fill="#0F2A3C" opacity="0.08"/>

  <!-- box: isometric-ish package -->
  <g>
    <!-- top face -->
    <polygon points="120,150 210,110 300,150 210,190" fill="url(#boxTop1)"/>
    <!-- front-left face -->
    <polygon points="120,150 210,190 210,290 120,250" fill="url(#boxFront1)"/>
    <!-- front-right face -->
    <polygon points="210,190 300,150 300,250 210,290" fill="url(#boxSide1)"/>

    <!-- tape lines -->
    <line x1="165" y1="130" x2="165" y2="270" stroke="#8A6D45" stroke-width="3" opacity="0.5"/>
    <polygon points="120,150 210,110 300,150 210,190" fill="none" stroke="#8A6D45" stroke-width="1.5" opacity="0.35"/>

    <!-- shipping label -->
    <g transform="translate(228,205)">
      <rect x="0" y="0" width="58" height="42" rx="3" fill="#FBFBFA" stroke="#D8D2C4" stroke-width="1"/>
      <rect x="7" y="7" width="44" height="4" rx="2" fill="#0F2A3C"/>
      <rect x="7" y="16" width="34" height="3" rx="1.5" fill="#8A97A0"/>
      <rect x="7" y="22" width="30" height="3" rx="1.5" fill="#8A97A0"/>
      <rect x="7" y="31" width="44" height="6" fill="#0F2A3C" opacity="0.85"/>
    </g>

    <!-- USJ ref tag on top -->
    <g transform="translate(178,132)">
      <rect x="0" y="0" width="46" height="16" rx="2" fill="#0F2A3C"/>
      <text x="23" y="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2EC4B6" font-weight="700">USJ-0092</text>
    </g>
  </g>

  <!-- camera / photo-capture motif, top-right -->
  <g transform="translate(285,60)">
    <rect x="-34" y="-2" width="68" height="46" rx="9" fill="#0F2A3C"/>
    <circle cx="0" cy="21" r="16" fill="#12384F"/>
    <circle cx="0" cy="21" r="16" fill="none" stroke="#2EC4B6" stroke-width="2.5"/>
    <circle cx="0" cy="21" r="7" fill="#0A2230"/>
    <rect x="-10" y="-9" width="20" height="9" rx="2" fill="#0F2A3C"/>
    <circle cx="20" cy="6" r="3.2" fill="#2EC4B6"/>
  </g>

  <!-- flash/capture rays -->
  <g stroke="#2EC4B6" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <line x1="243" y1="78" x2="222" y2="96"/>
    <line x1="252" y1="98" x2="230" y2="108"/>
  </g>

  <!-- corner framing brackets, subtle "photo frame" cue -->
  <g stroke="#0F2A3C" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M40 40 L40 66 M40 40 L66 40"/>
    <path d="M360 40 L360 66 M360 40 L334 40"/>
    <path d="M40 360 L40 334 M40 360 L66 360"/>
    <path d="M360 360 L360 334 M360 360 L334 360"/>
  </g>
</svg>
